name: CI

# Development happens on Linux, so this runs only on macOS: it is the one place
# the `cfg(target_os = "macos")` code paths get compiled and tested before a
# release. Pushes that change only docs or notes skip CI with `[skip ci]`.
on:
  pull_request:
    branches:
      - main
    paths-ignore:
      - "docs/**"
      - "**.md"
      - ".agents/**"
  push:
    branches:
      - main
    paths-ignore:
      - "docs/**"
      - "**.md"
      - ".agents/**"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test & Smoke Check
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      # `.cargo/config.toml` builds into `.local/target`, not `./target`.
      # The prefix bump drops the old entries that held only the registry.
      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: v1-rust
          workspaces: ". -> .local/target"

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run tests
        run: cargo test --workspace --locked

      - name: Smoke test CLI
        run: cargo run -p tokenpulse-cli --locked -- --help
