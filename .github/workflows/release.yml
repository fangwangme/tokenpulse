name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest
            goos: darwin
            goarch: amd64
            asset: tokenpulse-darwin-x64
          - runner: macos-latest
            goos: darwin
            goarch: arm64
            asset: tokenpulse-darwin-arm64
          - runner: ubuntu-22.04
            goos: linux
            goarch: amd64
            asset: tokenpulse-linux-x64-gnu
          - runner: ubuntu-22.04-arm
            goos: linux
            goarch: arm64
            asset: tokenpulse-linux-arm64-gnu
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build web app
        working-directory: web
        run: |
          npm ci
          npm run build

      - name: Build release binary
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          mkdir -p .local/release/${{ matrix.asset }}
          go build -trimpath -ldflags="-s -w" -o .local/release/${{ matrix.asset }}/tokenpulse .
          tar -C .local/release/${{ matrix.asset }} -czf .local/release/${{ matrix.asset }}/${{ matrix.asset }}.tar.gz tokenpulse

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: .local/release/${{ matrix.asset }}/${{ matrix.asset }}.tar.gz

  publish-release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Publish GitHub release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if .github/scripts/extract-release-notes.sh "${GITHUB_REF_NAME#v}" > release-notes.md; then
            gh release create "${GITHUB_REF_NAME}" dist/*/*.tar.gz \
              --title "${GITHUB_REF_NAME}" \
              --notes-file release-notes.md
          else
            echo "::warning::No CHANGELOG section for ${GITHUB_REF_NAME}; using generated notes."
            gh release create "${GITHUB_REF_NAME}" dist/*/*.tar.gz \
              --title "${GITHUB_REF_NAME}" \
              --generate-notes
          fi

  publish-npm:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Assemble packages
        run: |
          node npm/scripts/build-packages.mjs \
            --version "${GITHUB_REF_NAME#v}" \
            --artifacts dist \
            --out .local/npm-dist

      - name: Publish to npm
        run: node npm/scripts/publish-packages.mjs .local/npm-dist
