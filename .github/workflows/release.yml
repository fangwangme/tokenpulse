name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing v* tag whose GitHub Release assets should be rebuilt
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.tag || github.ref }}
  cancel-in-progress: true

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Both macOS targets build on Apple Silicon. The Intel `macos-13`
          # runner is no longer allocated — jobs requesting it sat queued for
          # the full 24h limit and were cancelled, which is why no release
          # before v0.5.0 ever published. Apple's clang cross-compiles by
          # architecture flag, so the x86_64 build needs only the extra target.
          - runner: macos-14
            target: x86_64-apple-darwin
            asset: tokenpulse-darwin-x64
          - runner: macos-14
            target: aarch64-apple-darwin
            asset: tokenpulse-darwin-arm64
          # 22.04 rather than latest: the binary then needs only glibc 2.35,
          # so it also runs on distros a couple of releases behind.
          - runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            asset: tokenpulse-linux-x64-gnu
          - runner: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
            asset: tokenpulse-linux-arm64-gnu
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Validate release tag
        run: |
          case "${RELEASE_TAG}" in
            v*) ;;
            *) echo "Release tag must start with v: ${RELEASE_TAG}" >&2; exit 1 ;;
          esac
          test "$(git tag --points-at HEAD --list "${RELEASE_TAG}")" = "${RELEASE_TAG}"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Build release binary
        run: cargo build --release -p tokenpulse-cli --locked --target ${{ matrix.target }}

      - name: Package archive
        run: |
          mkdir -p .local/release/tokenpulse-${{ matrix.target }}
          cp .local/target/${{ matrix.target }}/release/tokenpulse \
            .local/release/tokenpulse-${{ matrix.target }}/tokenpulse
          tar -C .local/release/tokenpulse-${{ matrix.target }} \
            -czf .local/release/tokenpulse-${{ matrix.target }}/${{ matrix.asset }}.tar.gz tokenpulse

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: tokenpulse-${{ matrix.target }}
          path: .local/release/tokenpulse-${{ matrix.target }}/*
          if-no-files-found: error

  publish-release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      # A manual run refreshes the assets of an existing release without moving
      # its tag or rewriting its notes. Upload the friendly names first, then
      # remove the legacy Rust-target-triple names only after every upload works.
      - name: Publish GitHub release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            gh release upload "${RELEASE_TAG}" dist/*/*.tar.gz --clobber

            for asset in \
              tokenpulse-aarch64-apple-darwin.tar.gz \
              tokenpulse-x86_64-apple-darwin.tar.gz \
              tokenpulse-aarch64-unknown-linux-gnu.tar.gz \
              tokenpulse-x86_64-unknown-linux-gnu.tar.gz
            do
              gh release delete-asset "${RELEASE_TAG}" "${asset}" --yes 2>/dev/null || true
            done
          elif .github/scripts/extract-release-notes.sh "${RELEASE_TAG#v}" > release-notes.md; then
            gh release create "${RELEASE_TAG}" dist/*/*.tar.gz \
              --title "${RELEASE_TAG}" \
              --notes-file release-notes.md
          else
            echo "::warning::No CHANGELOG section for ${RELEASE_TAG}; using generated notes."
            gh release create "${RELEASE_TAG}" dist/*/*.tar.gz \
              --title "${RELEASE_TAG}" \
              --generate-notes
          fi

  publish-npm:
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"

      # Fails loudly when the tag and the crate version disagree, before
      # anything reaches the registry — a published version cannot be replaced.
      - name: Assemble packages
        run: |
          node npm/scripts/build-packages.mjs \
            --version "${RELEASE_TAG#v}" \
            --artifacts dist \
            --out .local/npm-dist

      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: node npm/scripts/publish-packages.mjs .local/npm-dist
