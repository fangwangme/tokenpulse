name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Both macOS targets build on Apple Silicon. The Intel `macos-13`
          # runner is no longer allocated — jobs requesting it sat queued for
          # the full 24h limit and were cancelled, which is why no release
          # before v0.5.0 ever published. Apple's clang cross-compiles by
          # architecture flag, so the x86_64 build needs only the extra target.
          - runner: macos-14
            target: x86_64-apple-darwin
          - runner: macos-14
            target: aarch64-apple-darwin
          # 22.04 rather than latest: the binary then needs only glibc 2.35,
          # so it also runs on distros a couple of releases behind.
          - runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Build release binary
        run: cargo build --release -p tokenpulse-cli --locked --target ${{ matrix.target }}

      - name: Package archive
        run: |
          mkdir -p .local/release/tokenpulse-${{ matrix.target }}
          cp .local/target/${{ matrix.target }}/release/tokenpulse \
            .local/release/tokenpulse-${{ matrix.target }}/tokenpulse
          tar -C .local/release/tokenpulse-${{ matrix.target }} \
            -czf .local/release/tokenpulse-${{ matrix.target }}.tar.gz tokenpulse

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: tokenpulse-${{ matrix.target }}
          path: .local/release/tokenpulse-${{ matrix.target }}.tar.gz

  publish-release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      # The curated CHANGELOG entry is the release note. Fall back to generated
      # notes only when a version has no section, rather than failing the release.
      - name: Publish GitHub release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if .github/scripts/extract-release-notes.sh "${GITHUB_REF_NAME#v}" > release-notes.md; then
            gh release create "${GITHUB_REF_NAME}" dist/*/*.tar.gz \
              --title "${GITHUB_REF_NAME}" \
              --notes-file release-notes.md
          else
            echo "::warning::No CHANGELOG section for ${GITHUB_REF_NAME}; using generated notes."
            gh release create "${GITHUB_REF_NAME}" dist/*/*.tar.gz \
              --title "${GITHUB_REF_NAME}" \
              --generate-notes
          fi

  publish-npm:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"

      # Fails loudly when the tag and the crate version disagree, before
      # anything reaches the registry — a published version cannot be replaced.
      - name: Assemble packages
        run: |
          node npm/scripts/build-packages.mjs \
            --version "${GITHUB_REF_NAME#v}" \
            --artifacts dist \
            --out .local/npm-dist

      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: node npm/scripts/publish-packages.mjs .local/npm-dist
